name: "Production pipeline"

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yaml
    with:
      environment: prod
      aws-assume-role-arn: "arn:aws:iam::515966499694:role/github-actions-gabszs-pipeline-terraform-access"
      aws-region: "sa-east-1"
